<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
     
    <title>Admission Form</title>
    <link rel="stylesheet" href="highbro.css">
    <style>
          body {
        margin: 0;
        font-family: Arial, sans-serif;
    }
    .navbar-nav li a {
  margin: 20px 0px;
}
.navbar-nav li a:hover{
    text-decoration: underline;
    color: #ff5722;
}
    .menulinks {
        position: relative;
        padding: 10px;
    }

    #menuicon {
        font-size: 24px;
        cursor: pointer;
        color: black;
        display: none; /* Initially hidden */
    }

    .navbar-collapse {
        display: none;
        background-color: white;
        padding: 10px;
        border-radius: 5px;
        position: absolute;
        top: 56px;
        right: 0px;
        z-index: 0;
    }

    .navbar-collapse.show {
        display: block; /* Show when active */
    }

    .navlink {
        display: block;
        margin: 5px 0;
        color: black;
        text-decoration: none;
    }
    ul li{
        text-decoration: none !important;
    }
    .buttons a {
        text-decoration: none;
        margin-right: 10px;
        padding: 5px 10px;
        border-radius: 5px;
    }

    .signup {
        background-color: #007bff;
        color: white;
    }
    .navlink:hover {
        text-decoration: underline;
        color: #ff5722;
        }
    .login {
        background-color: #FE5D26;;
        color: white;
    }

    @media (max-width: 768px) {
        #menuicon {
            display: block; /* Display the icon on small screens */
        }

        .navbar-collapse {
            display: none; /* Hide the links by default */
        }
    }
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin-top: 4%;
            background: linear-gradient(120deg, #FE5D26, #d3572dbb);
        }

        .form-container {
            background: #fff;
            padding: 20px 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            max-width: 600px;
            width: 100%;
        }

        .form-container h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #333;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #555;
        }

        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
        }

        .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
            border-color: #4caf50;
            outline: none;
        }

        .form-group input[type="file"] {
            padding: 0;
        }

        .error {
            color: red;
            font-size: 14px;
        }

        .navigation-buttons {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
        }

        .nav-btn {
            padding: 10px 20px;
            background-color: #FE5D26;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        .nav-btn:hover {
            background-color: #45a049;
        }

        .hidden {
            display: none;
        }

        @media (max-width: 768px) {
            .form-container {
                padding: 15px 20px;
            }

            .form-group input, .form-group select, .form-group textarea {
                font-size: 14px;
            }

            .nav-btn {
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <header class="header" >
        <div class="logo">
            <img src="highbroimage/Logo final.png" alt="Logo" height="50px">

            <h1 class="heading">Highbrows</h1>
            <script>
                // Generate stars for background effect
                const starsContainer = document.querySelector('.stars');
                const numberOfStars = 100;
        
                for (let i = 0; i < numberOfStars; i++) {
                    const star = document.createElement('div');
                    star.classList.add('star');
        
                    // Randomize position and animation delay
                    star.style.top = Math.random() * 100 + '%';
                    star.style.left = Math.random() * 100 + '%';
                    star.style.animationDelay = Math.random() * 3 + 's';
        
                    starsContainer.appendChild(star);
                }
            </script>
        </div>
        <nav class="nav-links">
            <a href="index.html#about" class="navlink">About Us</a>
            <a href="index.html" class="navlink">Programs</a>
            <a href="index.html" class="navlink">Courses</a>
            <a href="blogs.html" class="navlink">Blogs</a>
            <a href="admission.html" class="navlink">Admission</a>
            <a href="houses.html" class="navlink">Houses</a>
        </nav>
        <div class="buttons">
            <a href="signup.html" class="signup">Sign Up</a>
            <a href="login.html" class="login">Login</a>
        </div>
        <div class="menulinks">
            <i id="menuicon" class="fa-solid fa-bars" data-bs-target="#navbarContent"></i>
            <div class="collapse navbar-collapse" id="navbarContent">
                <ul class="navbar-nav">
                    <li><a class="navlink" href="index.html">About Us</a></li>
                    <li><a class="navlink" href="#Programs">Programs</a></li>
                    <li><a class="navlink" href="#Courses">Courses</a></li>
                    <li><a class="navlink" href="admission.html">Admission</a></li>
                    <li><a class="navlink" href="blogs.html">Blogs</a></li>

                    <li><a class="navlink" href="houses.html">Houses</a></li>
                </ul>
                <div class="menubuttons">
                    <a href="signup.html" class="signup">Sign Up</a>
                    <a href="login.html" class="login">Login</a>
                </div>
            </div>
        </div>
    
        <script>
            // JavaScript to Toggle Menu
            const menuIcon = document.getElementById('menuicon');
            const navbarContent = document.getElementById('navbarContent');
    
            menuIcon.addEventListener('click', () => {
                navbarContent.classList.toggle('show');

                if (navbarContent.classList.contains('show')) {
                        menuIcon.style.color = '#ff5722';
                    } else {
                        menuIcon.style.color = 'black';
                    }
            });
        </script>
    </header>
    <div class="form-container">
        <h2>Admission Form</h2>
        <form id="admissionForm">
            <div class="form-step" id="step1">
                <div class="form-group">
                    <label for="fullName">Full Name:</label>
                    <input type="text" id="fullName" name="fullName">
                    <span class="error" id="fullNameError"></span>
                </div>
                <div class="form-group">
                    <label for="fatherName">Father Name:</label>
                    <input type="text" id="fatherName" name="fatherName">
                    <span class="error" id="fatherNameError"></span>
                </div>
                <div class="form-group">
                    <label for="motherName">Mother Name:</label>
                    <input type="text" id="motherName" name="motherName">
                    <span class="error" id="motherNameError"></span>
                </div>
                <div class="form-group">
                    <label for="fatherCnic">Father CNIC:</label>
                    <input type="text" id="fatherCnic" name="fatherCnic">
                    <span class="error" id="fatherCnicError"></span>
                </div>
                <div class="form-group">
                    <label for="motherCnic">Mother CNIC:</label>
                    <input type="text" id="motherCnic" name="motherCnic">
                    <span class="error" id="motherCnicError"></span>
                </div>
            </div>

            <div class="form-step hidden" id="step2">
                <div class="form-group">
                    <label for="guardianName">Guardian Name (if available):</label>
                    <input type="text" id="guardianName" name="guardianName">
                </div>
                <div class="form-group">
                    <label for="religion">Religion:</label>
                    <input type="text" id="religion" name="religion">
                    <span class="error" id="religionError"></span>
                </div>
                <div class="form-group">
                    <label for="section">Section:</label>
                    <input type="text" id="section" name="section">
                    <span class="error" id="sectionError"></span>
                </div>
                <div class="form-group">
                    <label for="dob">Date of Birth:</label>
                    <input type="date" id="dob" name="dob">
                    <span class="error" id="dobError"></span>
                </div>
                <div class="form-group">
                    <label for="gender">Gender:</label>
                    <select id="gender" name="gender">
                        <option value="">Select</option>
                        <option value="Male">Male</option>
                        <option value="Female">Female</option>
                        <option value="Other">Other</option>
                    </select>
                    <span class="error" id="genderError"></span>
                </div>
            </div>

            <div class="form-step hidden" id="step3">
                <div class="form-group">
                    <label for="contact">Contact Number:</label>
                    <input type="text" id="contact" name="contact">
                    <span class="error" id="contactError"></span>
                </div>
                <div class="form-group">
                    <label for="domicile">Domicile District:</label>
                    <input type="text" id="domicile" name="domicile">
                    <span class="error" id="domicileError"></span>
                </div>
                <div class="form-group">
                    <label for="postalAddress">Postal Address:</label>
                    <textarea id="postalAddress" name="postalAddress"></textarea>
                    <span class="error" id="postalAddressError"></span>
                </div>
                <div class="form-group">
                    <label for="guardianPhone">Guardian Phone:</label>
                    <input type="text" id="guardianPhone" name="guardianPhone">
                    <span class="error" id="guardianPhoneError"></span>
                </div>
                <div class="form-group">
                    <label for="guardianWhatsapp">Guardian WhatsApp:</label>
                    <input type="text" id="guardianWhatsapp" name="guardianWhatsapp">
                    <span class="error" id="guardianWhatsappError"></span>
                </div>
            </div>

            <div class="form-step hidden" id="step4">
                <div class="form-group">
                    <label for="fatherIncome">Father Income (Document):</label>
                    <input type="file" id="fatherIncome" name="fatherIncome">
                    <span class="error" id="fatherIncomeError"></span>
                </div>
                <div class="form-group">
                    <label for="passportPic">Passport Size Picture:</label>
                    <input type="file" id="passportPic" name="passportPic">
                    <span class="error" id="passportPicError"></span>
                </div>
                <div class="form-group">
                    <label for="bForm">B-Form:</label>
                    <input type="file" id="bForm" name="bForm">
                    <span class="error" id="bFormError"></span>
                </div>
                <div class="form-group">
                    <label for="fatherCnicDoc">Father CNIC (Document):</label>
                    <input type="file" id="fatherCnicDoc" name="fatherCnicDoc">
                    <span class="error" id="fatherCnicDocError"></span>
                </div>
                <div class="form-group">
                    <label for="resultCard">Last Result Card:</label>
                    <input type="file" id="resultCard" name="resultCard">
                    <span class="error" id="resultCardError"></span>
                </div>
            </div>

            <div class="navigation-buttons">
                <button type="button" class="nav-btn" id="prevBtn" onclick="changeStep(-1)">Previous</button>
                <button type="button" class="nav-btn" id="nextBtn" onclick="changeStep(1)">Next</button>
            </div>
        </form>
    </div>

    <script>
        let currentStep = 1;
        const totalSteps = 4;

        function showStep(step) {
            document.querySelectorAll(".form-step").forEach((stepDiv, index) => {
                stepDiv.classList.toggle("hidden", index + 1 !== step);
            });
            document.getElementById("prevBtn").style.display = step === 1 ? "none" : "inline-block";
            document.getElementById("nextBtn").textContent = step === totalSteps ? "Submit" : "Next";
        }

        function changeStep(direction) {
            if (direction === 1 && !validateCurrentStep()) return;

            currentStep += direction;

            if (currentStep > totalSteps) {
                document.getElementById("admissionForm").submit();
            } else {
                showStep(currentStep);
            }
        }

        function validateCurrentStep() {
            const stepFields = document.querySelectorAll(`#step${currentStep} input, #step${currentStep} select, #step${currentStep} textarea`);
            let isValid = true;

            stepFields.forEach(field => {
                const errorElement = document.getElementById(field.id + "Error");
                errorElement.textContent = "";

                if (!field.value.trim()) {
                    errorElement.textContent = `${field.name.replace(/([A-Z])/g, " $1").replace(/^./, str => str.toUpperCase())} is required.`;
                    isValid = false;
                }
            });

            return isValid;
        }

        document.getElementById("prevBtn").style.display = "none";
        showStep(currentStep);
    </script>
</body>
</html>
